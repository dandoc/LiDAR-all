<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XT-M60 프레임 점군</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10161d;color:#e8eef5;font:15px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:23px;margin:0 0 12px}p{color:#b9c6d6}label{display:inline-flex;gap:8px;align-items:center}input,button,select{font:inherit}button,select{background:#253241;color:#e8eef5;border:1px solid #536171;border-radius:6px;padding:8px}input[type=range]{width:230px}.bar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:14px 0}canvas{width:100%;height:550px;background:#0a1017;touch-action:none;border-radius:8px}#status,#detail{min-height:26px;white-space:pre-wrap}.hint{font-size:13px}.legend{display:flex;align-items:center;gap:8px}.ramp{width:150px;height:10px;background:linear-gradient(90deg,hsl(220,90%,65%),hsl(110,90%,65%),hsl(0,90%,65%))}@media(max-width:600px){main{padding:12px}canvas{height:420px}input[type=range]{width:170px}}
</style></head><body><main>
<h1>XT-M60 프레임 점군</h1>
<p>capture.csv를 열고 각 프레임의 실제 XYZ 좌표를 확인하세요. 드래그: 회전 · 휠: 확대 · 점 클릭: 픽셀과 거리</p>
<div class="bar"><label>프레임 파일 <input id="file" type="file" accept=".csv"></label><button id="reset">정면 / 화면 맞춤</button><label>점 크기 <input id="size" type="range" min="1" max="7" step="0.5" value="2"></label></div>
<div class="bar"><button id="prev">이전</button><input id="frame" aria-label="프레임" type="range" min="0" max="0" value="0" disabled><button id="next">다음</button><span id="index">파일을 선택하세요</span></div>
<div id="status" role="status"></div><canvas id="cloud" aria-label="3차원 점군"></canvas>
<div class="bar"><div class="legend"><span id="near">가까움</span><span class="ramp"></span><span id="far">멀음</span></div></div>
<div id="detail" role="status">점 클릭 시 XYZ(m), depth(mm), 행·열을 표시합니다.</div>
<p class="hint">무효 depth와 NaN 좌표는 제외됩니다. 색상 범위는 파일 전체에서 고정됩니다. 보정과 점군 변환은 제조사 SDK가 수행하며, 뷰어는 좌표를 추가 변환하지 않습니다.</p>
</main><script>
(() => {
const el=id=>document.getElementById(id), canvas=el('cloud'), ctx=canvas.getContext('2d');
let frames=[], lo=0,hi=1,center=[0,0,0],span=1,yaw=0,pitch=0,zoom=1,projected=[],drag=null,moved=false;
function selected(){return frames[Number(el('frame').value)];}
function fit(){const pts=selected()?.points||[];if(!pts.length){center=[0,0,0];span=1;return;}const min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];for(const p of pts)for(let k=0;k<3;k++){min[k]=Math.min(min[k],p.xyz[k]);max[k]=Math.max(max[k],p.xyz[k]);}center=min.map((v,k)=>(v+max[k])/2);span=Math.max(...min.map((v,k)=>max[k]-v),0.01);}
function draw(){const rect=canvas.getBoundingClientRect(),w=rect.width,h=rect.height,dpr=window.devicePixelRatio||1;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const f=selected();projected=[];if(!f){ctx.fillStyle='#b9c6d6';ctx.font='16px system-ui';ctx.fillText('실제 프레임 파일을 선택하세요',24,38);return;}
el('index').textContent=`${Number(el('frame').value)+1} / ${frames.length} · frame ${f.id}`;el('status').textContent=`${f.width} × ${f.height} · 유효 점 ${f.points.length.toLocaleString()} / ${f.total.toLocaleString()}`;
const scale=Math.min(w,h)*.78/span*zoom,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
for(const p of f.points){const [x,y,z]=p.xyz.map((v,k)=>v-center[k]);const rx=x*cy+z*sy,rz=-x*sy+z*cy;const ry=y*cp-rz*sp,d=y*sp+rz*cp;projected.push({x:w/2+rx*scale,y:h/2-ry*scale,d,p});}projected.sort((a,b)=>b.d-a.d);
for(const q of projected){if(q.x<0||q.x>w||q.y<0||q.y>h)continue;const t=Math.max(0,Math.min(1,(q.p.depth-lo)/(hi-lo||1)));ctx.fillStyle=`hsl(${220*(1-t)},90%,65%)`;const r=Number(el('size').value);ctx.fillRect(q.x-r/2,q.y-r/2,r,r);}
if(!f.points.length){ctx.fillStyle='#b9c6d6';ctx.font='16px system-ui';ctx.fillText('이 프레임에는 유효 점이 없습니다',24,38);}}
function change(){el('detail').textContent='점 클릭 시 XYZ(m), depth(mm), 행·열을 표시합니다.';draw();}
el('file').addEventListener('change',async e=>{try{const file=e.target.files[0];if(!file)return;const text=await file.text(),map=new Map();let count=0;lo=Infinity;hi=-Infinity;
for(const raw of text.split(/\r?\n/)){const line=raw.trim();if(!line||line.startsWith('frame,'))continue;const a=line.split(',');if(a[0]==='#frame'){if(a.length!==6)throw Error('프레임 메타데이터 형식 오류');const nums=a.slice(1).map(Number);if(nums.some(v=>!Number.isFinite(v)))throw Error('프레임 메타데이터 오류');const [id,width,height,total]=nums;map.set(id,{id,width,height,total,points:[]});continue;}if(line.startsWith('#'))continue;if(a.length!==7)throw Error('CSV 열 개수 오류');const n=a.map(Number);if(n.some(v=>!Number.isFinite(v)))throw Error('유효하지 않은 숫자');const [id,row,col,depth,x,y,z]=n;const f=map.get(id);if(!f)throw Error('프레임 메타데이터가 없습니다');if(depth<=0||depth>=964000)continue;f.points.push({row,col,depth,xyz:[x,y,z]});lo=Math.min(lo,depth);hi=Math.max(hi,depth);if(++count>1000000)throw Error('최대 100만 점까지 열 수 있습니다');}
if(!map.size)throw Error('프레임이 없습니다');frames=[...map.values()];if(!count){lo=0;hi=1;}el('frame').max=frames.length-1;el('frame').value=0;el('frame').disabled=false;el('near').textContent=`${(lo/1000).toFixed(2)}m`;el('far').textContent=`${(hi/1000).toFixed(2)}m`;yaw=pitch=0;zoom=1;fit();change();}catch(err){frames=[];el('frame').disabled=true;el('status').textContent=`열기 실패: ${err.message}`;draw();}});
el('frame').addEventListener('input',change);el('size').addEventListener('input',draw);el('prev').onclick=()=>{el('frame').value=Math.max(0,Number(el('frame').value)-1);change();};el('next').onclick=()=>{el('frame').value=Math.min(frames.length-1,Number(el('frame').value)+1);change();};el('reset').onclick=()=>{yaw=pitch=0;zoom=1;fit();draw();};
canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};moved=false;canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>1)moved=true;yaw+=dx*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch+dy*.008));drag={x:e.clientX,y:e.clientY};draw();};canvas.onpointerup=e=>{drag=null;if(moved)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let nearest=null,best=100;for(const q of projected){const d=(q.x-x)**2+(q.y-y)**2;if(d<best){best=d;nearest=q.p;}}if(nearest)el('detail').textContent=`행 ${nearest.row} · 열 ${nearest.col} (0부터 시작) | depth ${nearest.depth} mm | XYZ = ${nearest.xyz.map(v=>v.toFixed(4)).join(', ')} m`;};canvas.onpointercancel=()=>{drag=null;};canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.05,Math.min(30,zoom*Math.exp(-e.deltaY*.001)));draw();},{passive:false});new ResizeObserver(draw).observe(canvas);draw();
})();
</script></body></html>
